name: Release

# Publie une nouvelle version de Relay sur GitHub Releases quand on pousse un tag « v* » (ex. v0.1.1).
# Le tag doit correspondre à la version de package.json.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${VERSION} de package.json."
            exit 1
          fi

      - run: npm ci

      - name: Générer l'icône si elle est absente
        shell: pwsh
        run: |
          if (-not (Test-Path build/icon.ico)) {
            npm i --no-save sharp
            npm run icons
          }

      - run: npm test

      - name: Préparer le brouillon de release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag --verify-tag --title "Relay $tag" --notes "Version $tag de Relay." --draft

      - name: Construire et publier l'installateur
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
